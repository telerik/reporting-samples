<header>
  <nav class="navbar navbar-expand-sm navbar-toggleable-sm border-bottom box-shadow mb-3"
    [ngClass]="isDark ? 'navbar-dark bg-dark' : 'navbar-light bg-white'">
    <div class="container">
      <a class="navbar-brand" [routerLink]="['/']">Telerik Web Report Designer and HTML5 Viewer Demo</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target=".navbar-collapse"
        aria-label="Toggle navigation" [attr.aria-expanded]="isExpanded" (click)="toggle()">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="navbar-collapse collapse d-sm-inline-flex flex-sm-row-reverse" [ngClass]="{ show: isExpanded }">
        <ul class="navbar-nav flex-grow">
          <li class="nav-item" [routerLinkActive]="['link-active']" [routerLinkActiveOptions]="{ exact: true }">
            <a class="nav-link" [ngClass]="isDark ? 'text-light' : 'text-dark'" [routerLink]="['/']">Designer</a>
          </li>
          <li class="nav-item" [routerLinkActive]="['link-active']">
            <a class="nav-link" [ngClass]="isDark ? 'text-light' : 'text-dark'" [routerLink]="['/viewer']">Viewer</a>
          </li>
          <li class="nav-item d-flex align-items-center ms-2">
            <span [ngClass]="isDark ? 'text-light' : 'text-dark'" style="font-size: 0.85rem;">☀</span>
            <label class="switch mx-1 mb-0">
              <input type="checkbox" [checked]="isDark" (change)="toggleTheme()">
              <span class="slider round"></span>
            </label>
            <span [ngClass]="isDark ? 'text-light' : 'text-dark'" style="font-size: 0.85rem;">🌙</span>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
